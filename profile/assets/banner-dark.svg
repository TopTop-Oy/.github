<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="TopTop: steady, because it keeps moving. A software studio in Helsinki.">
<title>TopTop: steady, because it keeps moving. A software studio in Helsinki.</title>
<defs>
  <clipPath id="body-dark"><path d="M10 30 C10 36 24 46 32 57 C40 46 54 36 54 30 Z"/></clipPath>
  <clipPath id="card-dark"><rect width="1280" height="400" rx="20"/></clipPath>
  <style>@font-face{font-family:'TT Display';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'TT Serif';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'TT Sans';src:url(data:font/woff2;base64,) format('woff2');}
.wobble{transform-box:view-box;transform-origin:32px 57px;animation:wobble 3.2s ease-in-out infinite}
.sheen{animation:spin .55s linear infinite}
.trace{transform-box:fill-box;transform-origin:center;animation:trace 3.2s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes spin{from{transform:translateX(0)}to{transform:translateX(76px)}}
@keyframes trace{0%,100%{transform:translateX(-1.5px) scaleX(.9)}50%{transform:translateX(2px) scaleX(1.1)}}
@media (prefers-reduced-motion:reduce){.wobble,.sheen,.trace{animation:none}.sheen{display:none}}
</style>
</defs>
<rect width="1280" height="400" rx="20" fill="#1C1916"/>

<g clip-path="url(#card-dark)"><ellipse cx="230" cy="214" rx="34" ry="32.0" fill="none" stroke="#2E2924" stroke-width="2.4"/><ellipse cx="230" cy="214" rx="52" ry="48.9" fill="none" stroke="#2E2924" stroke-width="1.4"/><ellipse cx="230" cy="214" rx="70" ry="65.8" fill="none" stroke="#2E2924" stroke-width="1.4"/><ellipse cx="230" cy="214" rx="88" ry="82.7" fill="none" stroke="#2E2924" stroke-width="2.4"/><ellipse cx="230" cy="214" rx="106" ry="99.6" fill="none" stroke="#2E2924" stroke-width="1.4"/><ellipse cx="230" cy="214" rx="124" ry="116.6" fill="none" stroke="#2E2924" stroke-width="1.4"/><ellipse cx="230" cy="214" rx="142" ry="133.5" fill="none" stroke="#2E2924" stroke-width="2.4"/><ellipse cx="230" cy="214" rx="160" ry="150.4" fill="none" stroke="#2E2924" stroke-width="1.4"/><ellipse cx="230" cy="214" rx="178" ry="167.3" fill="none" stroke="#2E2924" stroke-width="1.4"/><ellipse cx="230" cy="214" rx="196" ry="184.2" fill="none" stroke="#2E2924" stroke-width="2.4"/><ellipse cx="230" cy="214" rx="214" ry="201.2" fill="none" stroke="#2E2924" stroke-width="1.4"/><ellipse cx="230" cy="214" rx="232" ry="218.1" fill="none" stroke="#2E2924" stroke-width="1.4"/></g>
<g transform="translate(118 74) scale(3.6)">
<g class="wobble">
  <g transform="rotate(-12 32 34)">
    <rect x="29" y="6" width="6" height="14" rx="2.5" fill="#F1EAE0"/>
    <path d="M10 30 C10 25 19 19 32 19 C45 19 54 25 54 30 Z" fill="#C94545"/>
    <path d="M10 30 C10 36 24 46 32 57 C40 46 54 36 54 30 Z" fill="#D9B98C"/>
    <g clip-path="url(#body-dark)">
      <g fill="none" stroke="#B08A5A" stroke-width=".7"><path d="M8 34 Q32 37.2 56 34"/><path d="M8 38 Q32 41.2 56 38"/><path d="M8 43 Q32 46.2 56 43"/><path d="M8 48.5 Q32 51.7 56 48.5"/></g>
      <rect class="sheen" x="-14" y="16" width="9" height="44" fill="#FFF8EC" opacity=".38"/>
    </g>
  </g>
</g>
<ellipse class="trace" cx="35" cy="59.2" rx="9" ry="1.6" fill="none" stroke="#9C7A4E" stroke-opacity=".55" stroke-width=".6"/></g>
<text x="470.0" y="196.0" font-family="TT Display" font-size="128" fill="#F1EAE0" text-anchor="start" letter-spacing="-2">TopTop</text>
<text x="474.0" y="252.0" font-family="TT Serif" font-size="34" fill="#CFC5B6" text-anchor="start" >Steady, because it keeps moving.</text>
<text x="474.0" y="306.0" font-family="TT Sans" font-size="23" fill="#B3A797" text-anchor="start" >A software studio in Helsinki. We build our own products</text>
<text x="474.0" y="338.0" font-family="TT Sans" font-size="23" fill="#B3A797" text-anchor="start" >and help other teams ship theirs.</text>

</svg>
